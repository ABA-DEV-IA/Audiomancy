name: Build and Deploy Backend to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.generate_tag.outputs.tag }}
    steps:
      # Récupération du code
      - uses: actions/checkout@v4

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Génération du tag
      - name: Generate tag
        id: generate_tag
        run: |
          TAG=$(date +'%Y-%m-%d_%H-%M-%S')
          echo "Using tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # Build de l'image Docker
      - name: Build Docker image
        run: |
          docker build -f backend/Dockerfile -t ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/audiomancy-back:${{ steps.generate_tag.outputs.tag }} backend/

      # Sauvegarde de l'image pour le job suivant
      - name: Save Docker image
        run: |
          docker save ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/audiomancy-back:${{ steps.generate_tag.outputs.tag }} -o /tmp/backend-image.tar

      # Upload de l'image en artifact
      - name: Upload image artifact
        uses: actions/upload-artifact@v3
        with:
          name: backend-image
          path: /tmp/backend-image.tar
          retention-days: 1

  push-to-acr:
    name: Push to Azure Container Registry
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Download de l'image
      - name: Download image artifact
        uses: actions/download-artifact@v3
        with:
          name: backend-image
          path: /tmp

      # Load de l'image Docker
      - name: Load Docker image
        run: |
          docker load -i /tmp/backend-image.tar

      # Connexion à Azure Container Registry
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
          registry: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io

      # Push de l'image vers ACR
      - name: Push Docker image to ACR
        run: |
          docker push ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/audiomancy-back:${{ needs.build.outputs.image_tag }}

  deploy-to-container:
    name: Deploy to Azure Container Instance
    runs-on: ubuntu-latest
    needs: [build, push-to-acr]
    steps:
      # Connexion à Azure
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Mise à jour de l'image du conteneur
      - name: Update Container Instance
        run: |
          az container create \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_CONTAINER_NAME }} \
            --image ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/audiomancy-back:${{ needs.build.outputs.image_tag }} \
            --registry-login-server ${{ secrets.AZURE_ACR_NAME }}.azurecr.io \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --dns-name-label ${{ secrets.AZURE_CONTAINER_DNS_LABEL }} \
            --ports 80

  restart-container:
    name: Restart Container if Running
    runs-on: ubuntu-latest
    needs: [build, deploy-to-container]
    steps:
      # Connexion à Azure
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Vérification de l'état du conteneur
      - name: Check container status
        id: check_status
        run: |
          STATUS=$(az container show \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_CONTAINER_NAME }} \
            --query "instanceView.state" -o tsv 2>/dev/null || echo "NotFound")
          echo "Container status: $STATUS"
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      # Redémarrage du conteneur seulement s'il est en cours d'exécution
      - name: Restart Container Instance
        if: steps.check_status.outputs.status == 'Running' || steps.check_status.outputs.status == 'Succeeded'
        run: |
          echo "Container is running, restarting..."
          az container restart \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_CONTAINER_NAME }}

      # Message si le conteneur n'est pas en cours d'exécution
      - name: Container not running
        if: steps.check_status.outputs.status != 'Running' && steps.check_status.outputs.status != 'Succeeded'
        run: |
          echo "Container is not running (status: ${{ steps.check_status.outputs.status }}). Skipping restart."