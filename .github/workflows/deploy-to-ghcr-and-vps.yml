name: Build, Push to GHCR and Deploy to VPS

on:
  push:
    branches:
      - main
      - dev
      - OVH
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.prod.yml'
      - 'deploy.sh'
      - '.github/workflows/deploy-to-ghcr-and-vps.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build and Push Docker Images to GitHub Container Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Récupération du code
      - name: Checkout code
        uses: actions/checkout@v4

      # Login to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Convertir le nom du repo en minuscules pour GHCR
      - name: Set lowercase repo name
        id: repo
        run: |
          echo "repo_lower=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # Build and push Backend image
      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.repo_lower }}/backend:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.repo_lower }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push Frontend image
      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.repo_lower }}/frontend:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.repo_lower }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

      # Summary
      - name: Images published to GHCR
        run: |
          echo "✅ Images published to GitHub Container Registry"
          echo "📦 Backend: ${{ env.REGISTRY }}/${{ steps.repo.outputs.repo_lower }}/backend:latest"
          echo "📦 Frontend: ${{ env.REGISTRY }}/${{ steps.repo.outputs.repo_lower }}/frontend:latest"
          echo "🔗 View at: https://github.com/${{ github.repository }}/pkgs/container/backend"

  deploy-to-vps:
    name: Deploy to OVH VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # Récupération du code (pour avoir le docker-compose.prod.yml et le script de déploiement)
      - name: Checkout code
        uses: actions/checkout@v4

      # Convertir le nom du repo en minuscules
      - name: Set lowercase repo name
        id: repo
        run: |
          echo "repo_lower=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # Préparer le répertoire de déploiement sur le VPS
      - name: Prepare deployment directory on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            mkdir -p /home/${{ secrets.VPS_USERNAME }}/audiomancy
            chmod 755 /home/${{ secrets.VPS_USERNAME }}/audiomancy

      # Copier les fichiers nécessaires sur le VPS
      - name: Copy deployment files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "docker-compose.prod.yml,deploy.sh"
          target: "/home/${{ secrets.VPS_USERNAME }}/audiomancy"
          strip_components: 0

      # Se connecter au VPS et déployer
      - name: Deploy on VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/${{ secrets.VPS_USERNAME }}/audiomancy

            # Créer le fichier .env avec les variables pour GHCR et Azure Key Vault
            cat > .env << EOF
            REGISTRY=ghcr.io
            REPO_NAME=${{ steps.repo.outputs.repo_lower }}
            VPS_HOST=${{ secrets.VPS_HOST }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

            # Azure Key Vault Configuration
            AZURE_KEY_VAULT_URL=${{ secrets.AZURE_KEY_VAULT_URL }}
            AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}
            AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}
            AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}
            EOF

            # Rendre le script de déploiement exécutable
            chmod +x deploy.sh

            # Exécuter le script de déploiement
            ./deploy.sh

      # Summary
      - name: Deployment successful
        run: |
          echo "✅ Deployment to VPS successful"
          echo "🚀 Application running at:"
          echo "   - Frontend: http://${{ secrets.VPS_HOST }}:3000"
          echo "   - Backend: http://${{ secrets.VPS_HOST }}:8000"
