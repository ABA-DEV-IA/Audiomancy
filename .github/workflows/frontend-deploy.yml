name: Build and Push Frontend Docker Image to Azure Container Registry

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.generate_tag.outputs.tag }}
    steps:
      # Récupération du code
      - uses: actions/checkout@v4

      # Setup Node.js pour cacher les dépendances
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      # Cache npm pour accélérer le build
      - name: Cache npm
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Installer les dépendances avant Docker pour profiter du cache
      - name: Install dependencies
        run: |
          cd frontend
          echo "Trying npm ci..."
          npm ci || (echo "npm ci failed, running npm install instead" && npm install)

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Génération du tag
      - name: Generate tag
        id: generate_tag
        run: |
          TAG=$(date +'%Y-%m-%d_%H-%M-%S')
          echo "Using tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # Build de l'image Docker
      - name: Build Docker image
        run: |
          docker build \
            --build-arg NODE_ENV=production \
            -f frontend/Dockerfile \
            -t ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/audiomancy-front:${{ steps.generate_tag.outputs.tag }} \
            frontend/

      # Sauvegarde de l'image pour le job suivant
      - name: Save Docker image
        run: |
          docker save ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/audiomancy-front:${{ steps.generate_tag.outputs.tag }} -o /tmp/frontend-image.tar

      # Upload de l'image en artifact
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: /tmp/frontend-image.tar
          retention-days: 1

  push-to-acr:
    name: Push to Azure Container Registry
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Download de l'image
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-image
          path: /tmp

      # Load de l'image Docker
      - name: Load Docker image
        run: |
          docker load -i /tmp/frontend-image.tar

      # Connexion à Azure Container Registry
      - name: Log in to Azure Container Registry
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
          registry: ${{ secrets.AZURE_ACR_NAME }}.azurecr.io

      # Push de l'image vers ACR
      - name: Push Docker image to ACR
        run: |
          docker push ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/audiomancy-front:${{ needs.build.outputs.image_tag }}

  deploy-to-container:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: [build, push-to-acr]
    steps:
      # Connexion à Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Mise à jour de l'image du conteneur
      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ secrets.AZURE_CONTAINER_FRONTEND_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/audiomancy-front:${{ needs.build.outputs.image_tag }}

  restart-container:
    name: Restart Container if Running
    runs-on: ubuntu-latest
    needs: [build, deploy-to-container]
    steps:
      # Connexion à Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Vérification de l'état du conteneur
      - name: Check container status
        id: check_status
        run: |
          STATUS=$(az containerapp show \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_CONTAINER_FRONTEND_NAME }} \
            --query "properties.runningStatus" -o tsv 2>/dev/null || echo "NotFound")
          echo "Container status: $STATUS"
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      # Redémarrage du conteneur seulement s'il est en cours d'exécution
      - name: Restart Container App
        if: steps.check_status.outputs.status == 'Running'
        run: |
          echo "Container is running, restarting..."
          az containerapp revision restart \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_CONTAINER_FRONTEND_NAME }}

      # Message si le conteneur n'est pas en cours d'exécution
      - name: Container not running
        if: steps.check_status.outputs.status != 'Running'
        run: |
          echo "Container is not running (status: ${{ steps.check_status.outputs.status }}). Skipping restart."
