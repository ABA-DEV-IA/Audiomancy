version: "3.8"

# Configuration de production pour le VPS OVH
# Dernière mise à jour : 2026-01-29

services:
  # ===================================================================
  # MongoDB - Base de données principale + Cache
  # ===================================================================
  mongodb:
    image: mongo:7.0
    container_name: audiomancy-mongodb
    restart: unless-stopped
    network_mode: "container:wg-easy"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================================================
  # Backend FastAPI - Image depuis GitHub Container Registry
  # ===================================================================
  backend:
    image: ${REGISTRY}/${REPO_NAME}/backend:latest
    container_name: audiomancy-backend
    restart: unless-stopped
    network_mode: "container:wg-easy"
    environment:
      # API Configuration
      FRONTEND_URL: http://frontend:3000
      ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://10.8.0.1:3000"
      SWAGGER_ON: "true"
      PORT: "8000"

      # HashiCorp Vault Configuration
      # Toutes les configurations sensibles (MongoDB, DeepSeek, Jamendo, API Key)
      # sont chargées depuis HashiCorp Vault au démarrage
      # Path: secrets/audiomancy/kv/{secret-name}
      VAULT_URL: ${VAULT_URL:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      VAULT_MOUNT_PATH: ${VAULT_MOUNT_PATH:-secrets}
      VAULT_PATH_PREFIX: ${VAULT_PATH_PREFIX:-audiomancy/kv}
    depends_on:
      mongodb:
        condition: service_healthy

  # ===================================================================
  # Frontend Next.js - Image depuis GitHub Container Registry
  # ===================================================================
  frontend:
    image: ${REGISTRY}/${REPO_NAME}/frontend:latest
    container_name: audiomancy-frontend
    restart: unless-stopped
    network_mode: "container:wg-easy"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      - backend

# ===================================================================
# Volumes persistants
# ===================================================================
volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local
