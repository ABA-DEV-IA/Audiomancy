version: "3.8"

services:
  # ===================================================================
  # MongoDB - Base de données principale + Cache
  # ===================================================================
  mongodb:
    image: mongo:7.0
    container_name: audiomancy-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - audiomancy-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================================================
  # Backend FastAPI - Image depuis DockerHub
  # ===================================================================
  backend:
    image: ${DOCKERHUB_USERNAME}/audiomancy-backend:latest
    container_name: audiomancy-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      FRONTEND_URL: http://frontend:3000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - audiomancy-network

  # ===================================================================
  # Frontend Next.js - Image depuis DockerHub
  # ===================================================================
  frontend:
    image: ${DOCKERHUB_USERNAME}/audiomancy-frontend:latest
    container_name: audiomancy-frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      NEXT_PUBLIC_API_URL: http://${VPS_HOST}:8000
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - audiomancy-network

# ===================================================================
# Volumes persistants
# ===================================================================
volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local

# ===================================================================
# Réseau interne
# ===================================================================
networks:
  audiomancy-network:
    driver: bridge
