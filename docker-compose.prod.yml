version: "3.8"

# Configuration de production pour le VPS OVH
# Dernière mise à jour : 2026-01-29

services:
  # ===================================================================
  # MongoDB - Base de données principale + Cache
  # ===================================================================
  mongodb:
    image: mongo:7.0
    container_name: audiomancy-mongodb
    restart: unless-stopped
    network_mode: "container:wg-easy"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================================================
  # Backend FastAPI - Image depuis GitHub Container Registry
  # ===================================================================
  backend:
    image: ${REGISTRY}/${REPO_NAME}/backend:latest
    container_name: audiomancy-backend
    restart: unless-stopped
    network_mode: "container:wg-easy"
    environment:
      # MongoDB Configuration (localhost car même network stack)
      MONGO_HOST: localhost
      MONGO_PORT: "27017"
      MONGO_DB_NAME: audiomancy

      # API Configuration
      FRONTEND_URL: http://localhost:3000
      ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://10.8.0.1:3000"
      SWAGGER_ON: "true"
      PORT: "8000"

      # Jamendo API (requis pour la musique)
      JAMENDO_CLIENT_ID: ${JAMENDO_CLIENT_ID:-}
      JAMENDO_URL: "https://api.jamendo.com/v3.0"

      # DeepSeek AI (requis pour l'IA)
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: "https://api.deepseek.com"
      DEEPSEEK_MODEL: "deepseek-chat"
      DEEPSEEK_TEMPERATURE: "0.0"
      DEEPSEEK_MAX_TOKENS: "512"

      # Vault Configuration
      AZURE_KEY_VAULT_URL: ${VAULT_URL:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}

      # API Security
      API_KEY: ${API_KEY:-changeme}
    depends_on:
      mongodb:
        condition: service_healthy

  # ===================================================================
  # Frontend Next.js - Image depuis GitHub Container Registry
  # ===================================================================
  frontend:
    image: ${REGISTRY}/${REPO_NAME}/frontend:latest
    container_name: audiomancy-frontend
    restart: unless-stopped
    network_mode: "container:wg-easy"
    environment:
      NEXT_PUBLIC_API_URL: http://10.8.0.1:8000
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      - backend

# ===================================================================
# Volumes persistants
# ===================================================================
volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local
