services:
  # ===================================================================
  # MongoDB - Base de données principale + Cache
  # ===================================================================
  mongodb:
    image: mongo:7.0
    container_name: audiomancy-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - audiomancy-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================================================
  # Backend FastAPI
  # ===================================================================
  backend:
    image: python:3.13-slim
    container_name: audiomancy-backend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      FRONTEND_URL: http://frontend:3000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - audiomancy-network
    volumes:
      - ./backend:/app
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # ===================================================================
  # Frontend Next.js
  # ===================================================================
  frontend:
    image: node:22-alpine
    container_name: audiomancy-frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      FASTAPI_URL: http://backend:8000
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3000"
    depends_on:
      - backend
    networks:
      - audiomancy-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: >
      sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install &&
      if [ \"$$NODE_ENV\" = 'production' ]; then pnpm build && pnpm start; else pnpm dev; fi"

  # ===================================================================
  # MONITORING STACK
  # ===================================================================
  # Le monitoring est maintenant dans docker-compose.monitoring.yml
  # Pour démarrer avec monitoring:
  #   docker-compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
  # ===================================================================

# ===================================================================
# Volumes persistants
# ===================================================================
volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local
  # Note: Les volumes de monitoring sont définis dans docker-compose.monitoring.yml

# ===================================================================
# Réseau interne
# ===================================================================
networks:
  audiomancy-network:
    driver: bridge
