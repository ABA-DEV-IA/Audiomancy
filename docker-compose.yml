services:
  # ===================================================================
  # MongoDB - Base de données principale + Cache
  # Remplace Azure Cosmos DB et Azure Blob Storage
  # ===================================================================
  mongodb:
    image: mongo:7.0
    container_name: audiomancy-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - audiomancy-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================================================
  # Backend FastAPI
  # ===================================================================
  backend:
    image: python:3.11-slim
    container_name: audiomancy-backend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      FRONTEND_URL: http://frontend:3000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - audiomancy-network
    volumes:
      - ./backend:/app
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # ===================================================================
  # Frontend Next.js
  # ===================================================================
  frontend:
    image: node:22-alpine
    container_name: audiomancy-frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      - backend
    networks:
      - audiomancy-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm install && npm run dev"

  # ===================================================================
  # MONITORING STACK (C20 - Compétence de surveillance)
  # ===================================================================

  # Prometheus - Collecte et stockage des métriques
  prometheus:
    image: prom/prometheus:latest
    container_name: audiomancy-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.listen-address=:9090'
    ports:
      - "19090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert.rules.local.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    networks:
      - audiomancy-network
    restart: unless-stopped

  # Grafana - Visualisation des métriques et logs
  grafana:
    image: grafana/grafana:latest
    container_name: audiomancy-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: ""
      GF_SERVER_HTTP_PORT: 9091
    ports:
      - "19091:9091"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - audiomancy-network
    restart: unless-stopped

  # Pushgateway - Pour métriques batch/cronjobs
  pushgateway:
    image: prom/pushgateway:latest
    container_name: audiomancy-pushgateway
    command:
      - '--web.listen-address=:9092'
    ports:
      - "19092:9092"
    networks:
      - audiomancy-network
    restart: unless-stopped

  # AlertManager - Gestion des alertes
  alertmanager:
    image: prom/alertmanager:latest
    container_name: audiomancy-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "19093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - audiomancy-network
    restart: unless-stopped

  # Loki - Agrégation de logs (RGPD-compliant)
  loki:
    image: grafana/loki:latest
    container_name: audiomancy-loki
    ports:
      - "19100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - audiomancy-network
    restart: unless-stopped

  # Promtail - Collecteur de logs Docker
  promtail:
    image: grafana/promtail:latest
    container_name: audiomancy-promtail
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - audiomancy-network
    restart: unless-stopped

# ===================================================================
# Volumes persistants
# ===================================================================
volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local
  # Monitoring volumes
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
  loki_data:
    driver: local

# ===================================================================
# Réseau interne
# ===================================================================
networks:
  audiomancy-network:
    driver: bridge
