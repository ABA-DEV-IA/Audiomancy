services:
  # ===================================================================
  # MongoDB - Base de données principale + Cache
  # Remplace Azure Cosmos DB et Azure Blob Storage
  # ===================================================================
  mongodb:
    image: mongo:7.0
    container_name: audiomancy-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - audiomancy-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===================================================================
  # Backend FastAPI
  # ===================================================================
  backend:
    image: python:3.11-slim
    container_name: audiomancy-backend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - audiomancy-network
    volumes:
      - ./backend:/app
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # ===================================================================
  # Frontend Next.js
  # ===================================================================
  frontend:
    image: node:22-alpine
    container_name: audiomancy-frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      - backend
    networks:
      - audiomancy-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm install && npm run dev"

  # ===================================================================
  # [OPTIONNEL] Jaeger - Tracing distribué (remplace Azure App Insights)
  # Décommenter pour activer le monitoring local
  # ===================================================================
  # jaeger:
  #   image: jaegertracing/all-in-one:latest
  #   container_name: audiomancy-jaeger
  #   restart: unless-stopped
  #   ports:
  #     - "16686:16686"
  #     - "6831:6831/udp"
  #     - "14268:14268"
  #   environment:
  #     COLLECTOR_ZIPKIN_HOST_PORT: :9411
  #   networks:
  #     - audiomancy-network

  # ===================================================================
  # [OPTIONNEL] HashiCorp Vault - Gestion des secrets (remplace Azure Key Vault)
  # Décommenter pour activer la gestion des secrets locale
  # ===================================================================
  # vault:
  #   image: hashicorp/vault:latest
  #   container_name: audiomancy-vault
  #   restart: unless-stopped
  #   ports:
  #     - "8200:8200"
  #   environment:
  #     VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:-myroot}
  #     VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
  #   cap_add:
  #     - IPC_LOCK
  #   networks:
  #     - audiomancy-network
  #   command: server -dev

# ===================================================================
# Volumes persistants
# ===================================================================
volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local

# ===================================================================
# Réseau interne
# ===================================================================
networks:
  audiomancy-network:
    driver: bridge
